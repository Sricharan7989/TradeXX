name: tradex

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradex_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tradex}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - tradex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradex} -d ${POSTGRES_DB:-tradex}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tradex-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - tradex_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tradex_postgres_data:
  tradex_redis_data:
